// The build shared by every ghidra-plugin-* repo, then what is this plugin's own.
apply from: 'gradle/ghidra-plugin-common.gradle'

dependencies {
	// MCP Java SDK (bundle: mcp-core + Jackson 3 JSON binding)
	implementation 'io.modelcontextprotocol.sdk:mcp:2.0.0'

	// Jetty 12 (ee11 = jakarta.servlet 6.1, matching the SDK's servlet transport)
	implementation 'org.eclipse.jetty:jetty-server:12.1.4'
	implementation 'org.eclipse.jetty.ee11:jetty-ee11-servlet:12.1.4'

	// Route the MCP SDK / Jetty / Reactor SLF4J 2.0 logging into Ghidra's Log4j2
	// (2.25.4, provided by Ghidra). Only the bridge is bundled; log4j-api/core come
	// from Ghidra's classpath.
	runtimeOnly('org.apache.logging.log4j:log4j-slf4j2-impl:2.25.4') {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
		exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
	}
}

// mcpserver-build.properties: the version, git commit (+dirty) and build time the running
// server reports (get_application_info, GET /version, the startup log line), so "which build
// am I talking to?" is answerable over the wire instead of by guessing from restarts.
buildStamp()

tasks.named('verify') {
	dependsOn 'smokeTest'
}

// Every tool, driven headless against a fresh import of the committed sample
// (src/test/smoke/, a freestanding ELF; build-sample.sh regenerates it). The script's own
// verdict is the result: analyzeHeadless exits 0 even when a postScript throws.
ghidraHeadless('smokeTest') {
	description = 'Run McpToolSmokeScript headless against a fresh import of the committed sample'
	importFile = file('src/test/smoke/target.bin')
	postScript 'McpToolSmokeScript.java'
	requiredLine = 'SMOKE OK'
}

tasks.register('generateSmokeSample', Exec) {
	group = 'Ghidra'
	description = 'Rebuild src/test/smoke/target*.{bin,a} from target.c with the host cc'
	commandLine 'sh', file('src/test/smoke/build-sample.sh').path
}
